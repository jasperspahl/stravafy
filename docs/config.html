<section>
	<div role="group">
		<button hx-get="/overview.html" hx-swap="outerHTML" hx-target="closest section" class="outline">Overview</button>
		<button hx-get="/activities.html" hx-swap="outerHTML" hx-target="closest section" class="outline">Activities</button>
		<button hx-get="/config.html" hx-swap="outerHTML" hx-target="closest section">Config</button>
	</div>
	<hgroup>
		<h2>Configuration</h2>
		<p>
			Configure the templates that get used when precessing you activities
	</p>
	</hgroup>
	<article id="podcast-config">
	<header>
		Podcast
		<input name="enabled" type="checkbox" role="switch" checked />
	</header>
	<form>
	<label for="template">
		<details>
			<summary>Template</summary>
			<p>The Templates use golangs text templating.</p>
			<p>Example:</p>
			<pre><code>Podcast: {{ .Show }}<br/>Episode: {{ .Name }}</code></pre>
			<p>You have the following variables available:</p>
			<dl>
			<dt><b>Name</b></dt>
			<dd>name of the episode</dd>
			<dt><b>Show</b></dt>
			<dd>name of the podcast</dd>
			<dt><b>Url</b></dt>
			<dd>url of the episode</dd>
			<dt><b>ShowUrl</b></dt>
			<dd>url of the podcast</dd>
			</dl>
		</details>
		</label>
		<textarea
			id="template"
			name="podcast-template"
			cols="30"
			rows="5"
		></textarea>
		</form>
		<footer>test</footer>
	</article>
</section>
